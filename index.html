<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Poker Accountant</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- صفحه ورود -->
    <div class="login-container" id="loginPage">
        <div class="login-center">
            <!-- لوگو -->
            <div class="login-logo">
                <div class="logo-icon">S</div>
                <h1>Silent.poker</h1>
                <p>Poker Intelligence</p>
            </div>

            <!-- فرم ورود -->
            <div class="login-card">
                <form onsubmit="handleLogin(event)">
                    <!-- انتخاب ادمین -->
                    <div class="form-group">
                        <label>انتخاب ادمین</label>
                        <div class="admin-buttons">
                            <button type="button" class="admin-btn active" onclick="selectAdmin('shahab')" style="background: rgba(255, 215, 0, 0.2); border-color: #FFD700;">شهاب</button>
                            <button type="button" class="admin-btn" onclick="selectAdmin('tiyam')" style="background: rgba(192, 192, 192, 0.2); border-color: #C0C0C0;">تیام</button>
                            <button type="button" class="admin-btn" onclick="selectAdmin('tabassam')" style="background: rgba(255, 182, 193, 0.2); border-color: #FFB6C1;">تبسم</button>
                            <button type="button" class="admin-btn" onclick="selectAdmin('arash')" style="background: rgba(184, 115, 51, 0.2); border-color: #B87333;">آرش</button>
                        </div>
                        <input type="hidden" id="adminName" value="shahab">
                    </div>

                    <!-- رمز عبور -->
                    <div class="form-group">
                        <input type="password" id="password" placeholder="رمز خود را وارد کنید" required>
                    </div>

                    <!-- دکمه ورود -->
                    <button type="submit" class="login-btn">ورود</button>
                </form>
                
                <div class="login-hint">
                    شهاب: 1234 | تیام: 4552 | تبسم: 9825 | آرش: 4321
                </div>
            </div>
        </div>
    </div>

    <!-- صفحه داشبورد -->
    <div class="dashboard" id="dashboard" style="display: none;">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="logo-small">S Silent Poker</div>
            </div>
            <div class="header-right">
                <span class="admin-name" id="adminDisplayName"></span>
                <button class="logout-btn" onclick="logout()">خروج</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- تب بازیکنان -->
            <section id="playersTab" class="tab-section active">
                <div class="section-header">
                    <h2>مدیریت بازیکنان</h2>
                </div>
                <div class="add-player-section">
                    <input type="text" id="newPlayerName" placeholder="نام بازیکن جدید...">
                    <button onclick="addPlayer()" class="btn-add">افزودن</button>
                </div>
                <div class="players-container" id="playersList"></div>
            </section>

            <!-- تب شارژ و پرداخت -->
            <section id="chargeTab" class="tab-section">
                <div class="section-header">
                    <h2>شارژ و پرداخت</h2>
                </div>
                <div class="search-section">
                    <input type="text" id="chargeSearch" placeholder="جستجو بازیکن...">
                    <button onclick="searchForCharge()" class="btn-search">جستجو</button>
                </div>
                <div class="players-container" id="chargeList"></div>
            </section>
        </main>

        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <nav class="nav-menu">
                <button class="nav-item active" onclick="switchTab('players')">
                    <span class="icon">👥</span>
                    <span>بازیکنان</span>
                </button>
                <button class="nav-item" onclick="switchTab('charge')">
                    <span class="icon">💳</span>
                    <span>شارژ و پرداخت</span>
                </button>
            </nav>
        </aside>
    </div>

    <!-- مودال سوابق -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>سوابق بازیکن</h2>
                <button class="modal-close" onclick="closeModal('historyModal')">&times;</button>
            </div>
            <div id="historyContent"></div>
        </div>
    </div>

    <!-- مودال شارژ -->
    <div id="chargeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>شارژ و پرداخت</h2>
                <button class="modal-close" onclick="closeModal('chargeModal')">&times;</button>
            </div>
            <div id="chargeContent"></div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
