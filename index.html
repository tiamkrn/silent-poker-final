<!-- تب تتر -->
<section id="usdtTab" class="tab-section">
    <div class="section-header">
        <h2>💵 تتر (USDT)</h2>
        <button class="btn-export" onclick="exportToExcel('usdt')">📥 دریافت اکسل امروز</button>
    </div>
    <div class="transaction-form">
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
            <input type="text" id="usdtPlayer" placeholder="نام بازیکن" required>
            <input type="number" id="usdtAmount" placeholder="مقدار USDT" step="0.01" required>
            <input type="number" id="usdtTokens" placeholder="تعداد ژتون" required>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
            <input type="text" id="usdtWallet" placeholder="نام والت" required>
            <input type="text" id="usdtHash" placeholder="هش تراکنش (Tx Hash)" required>
        </div>
        <div style="margin-top: 10px;">
            <label style="display: block; font-size: 12px; margin-bottom: 8px; color: var(--text-secondary);">📸 عکس اسکین عملیات (اختیاری)</label>
            <input type="file" id="usdtScreenshot" accept="image/*" style="width: 100%; padding: 8px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary);">
        </div>
        <button onclick="addTransaction('usdt')" class="btn-add" style="width: 100%; margin-top: 10px;">افزودن تراکنش</button>
    </div>
    <div id="usdtTransactions" class="transactions-table"></div>
</section>
