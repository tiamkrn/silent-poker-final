<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Poker - گزارش‌های روزانه</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
    <style>
        :root {
            --primary: #808080;
            --secondary: #606060;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --border-color: #2d3548;
            --admin-color: #FFD700;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
        }

        .login-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 { text-align: center; color: var(--admin-color); margin-bottom: 10px; }
        .subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 30px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }

        input, select {
            width: 100%;
            padding: 12px;
            background: var(--dark-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }

        input:focus, select:focus { outline: none; border-color: var(--admin-color); }

        .admin-btn {
            padding: 12px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .admin-btn:hover, .admin-btn.active {
            background: var(--admin-color);
            color: var(--dark-bg);
            border-color: var(--admin-color);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--admin-color);
            color: var(--dark-bg);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .btn-login:hover { opacity: 0.9; }

        .dashboard {
            display: none;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
        }

        .dashboard.active { display: block; }

        .navbar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 { color: var(--admin-color); margin-bottom: 5px; }
        #adminDisplayName { color: var(--text-secondary); font-size: 14px; }

        .btn-logout {
            padding: 10px 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-logout:hover { background: #ff5252; }

        .dashboard-content { max-width: 1200px; margin: 40px auto; padding: 20px; }
        .report-section h3 { color: var(--admin-color); margin-bottom: 20px; text-align: center; }

        .button-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            justify-items: center;
        }

        .btn-report {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 30px;
            background: linear-gradient(135deg, var(--admin-color), #ffd700);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            min-width: 150px;
        }

        .btn-report:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(255, 215, 0, 0.3); }
        .btn-report .icon { font-size: 32px; }

        .message {
            text-align: center;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            font-weight: 600;
            display: none;
        }

        .message.success { background: rgba(76, 175, 80, 0.2); color: #4caf50; display: block; }
        .message.error { background: rgba(244, 67, 54, 0.2); color: #f44336; display: block; }
    </style>
</head>
<body>
    <!-- صفحه ورود -->
    <div id="loginPage" class="login-container">
        <div class="login-box">
            <h1>🎰 Silent Poker</h1>
            <p class="subtitle">سیستم گزارش روزانه</p>
            
            <form onsubmit="handleLogin(event)">
                <div style="margin-bottom: 20px;">
                    <label>انتخاب ادمین:</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                        <button type="button" class="admin-btn" onclick="selectAdmin('shahab')">Shahab</button>
                        <button type="button" class="admin-btn" onclick="selectAdmin('tiyam')">Tiyam</button>
                        <button type="button" class="admin-btn" onclick="selectAdmin('tabassam')">Tabassam</button>
                        <button type="button" class="admin-btn" onclick="selectAdmin('arash')">Arash</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>رمز عبور:</label>
                    <input type="password" id="password" class="form-input" placeholder="رمز عبور" required>
                </div>

                <button type="submit" class="btn-login">ورود</button>
            </form>
        </div>
    </div>

    <!-- داشبورد -->
    <div id="dashboard" class="dashboard">
        <div class="navbar">
            <div>
                <h2>🎰 Silent Poker</h2>
                <span id="adminDisplayName"></span>
            </div>
            <button onclick="logout()" class="btn-logout">خروج</button>
        </div>

        <div class="dashboard-content">
            <div class="report-section">
                <h3>📊 گزارش‌های دوره‌ای</h3>
                <div class="button-group">
                    <button class="btn-report" onclick="downloadDailyReport()">
                        <span class="icon">📅</span>
                        <span class="text">روزانه</span>
                    </button>
                    <button class="btn-report" onclick="downloadWeeklyReport()">
                        <span class="icon">📊</span>
                        <span class="text">هفتگی</span>
                    </button>
                    <button class="btn-report" onclick="downloadMonthlyReport()">
                        <span class="icon">📈</span>
                        <span class="text">ماهانه</span>
                    </button>
                </div>
            </div>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script>
        // تنظیمات
        const admins = {
            shahab: { password: '1234', name: 'شهاب', color: '#FFD700' },
            tiyam: { password: '4552', name: 'تیام', color: '#C0C0C0' },
            tabassam: { password: '9825', name: 'تبسم', color: '#FFB6C1' },
            arash: { password: '4321', name: 'آرش', color: '#B87333' }
        };

        let currentAdmin = null;
        let selectedAdmin = null;
        let transactions = [];

        function loadData() {
            const saved = localStorage.getItem('silentPokerTransactions');
            if (saved) transactions = JSON.parse(saved);
        }

        function saveData() {
            localStorage.setItem('silentPokerTransactions', JSON.stringify(transactions));
        }

        function selectAdmin(adminId) {
            selectedAdmin = adminId;
            document.querySelectorAll('.admin-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function handleLogin(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            
            if (!selectedAdmin) {
                alert('❌ یک ادمین انتخاب کنید!');
                return;
            }
            
            const admin = admins[selectedAdmin];
            if (admin.password !== password) {
                alert('❌ رمز عبور نادرست است!');
                return;
            }
            
            currentAdmin = selectedAdmin;
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            document.getElementById('adminDisplayName').textContent = '👋 سلام ' + admin.name;
        }

        function logout() {
            currentAdmin = null;
            selectedAdmin = null;
            document.getElementById('password').value = '';
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('dashboard').classList.remove('active');
            document.querySelectorAll('.admin-btn').forEach(btn => btn.classList.remove('active'));
        }

        function getTodayDate() {
            return new Date().toLocaleDateString('fa-IR');
        }

        function getWeekRange() {
            const today = new Date();
            const day = today.getDay();
            const start = new Date(today);
            start.setDate(today.getDate() - day);
            return {
                start: start.toLocaleDateString('fa-IR'),
                end: today.toLocaleDateString('fa-IR')
            };
        }

        function getMonthRange() {
            const today = new Date();
            const start = new Date(today.getFullYear(), today.getMonth(), 1);
            const end = new Date(today.getFullYear(), today.getMonth() + 1, 0);
            return {
                start: start.toLocaleDateString('fa-IR'),
                end: end.toLocaleDateString('fa-IR')
            };
        }

        function filterTransactions(startDate, endDate) {
            return transactions.filter(t => {
                const tDate = t.date || '';
                return tDate >= startDate && tDate <= endDate;
            });
        }

        function showMessage(msg, type) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.className = 'message ' + type;
            setTimeout(() => el.className = 'message', 3000);
        }

        function createExcel(filtered, title, fileName) {
            if (filtered.length === 0) {
                showMessage('❌ هیچ تراکنشی برای این دوره یافت نشد!', 'error');
                return;
            }

            // دسته‌بندی
            const usdt = filtered.filter(t => t.type === 'usdt-bep20' || t.type === 'usdt-trc20');
            const trx = filtered.filter(t => t.type === 'trx');
            const rial = filtered.filter(t => t.type === 'rial');
            const debt = filtered.filter(t => t.type === 'debt');
            const card = filtered.filter(t => t.type === 'card');
            const payment = filtered.filter(t => t.type === 'payment');
            const cashout = filtered.filter(t => t.type === 'cashout-rial' || t.type === 'cashout-wallet');

            const wb = XLSX.utils.book_new();
            const admin = admins[currentAdmin];

            // خلاصه
            const summary = [
                [admin.name + ' - ' + title],
                [''],
                ['نوع تراکنش', 'تعداد', 'کل مبلغ', 'کل ژتون'],
                ['تتر (USDT)', usdt.length, usdt.reduce((s, t) => s + (t.amount || 0), 0), usdt.reduce((s, t) => s + (t.tokens || 0), 0)],
                ['ترون (TRX)', trx.length, trx.reduce((s, t) => s + (t.amount || 0), 0), trx.reduce((s, t) => s + (t.tokens || 0), 0)],
                ['ریالی', rial.length, rial.reduce((s, t) => s + (t.amount || 0), 0), 0],
                ['بدهی', debt.length, debt.reduce((s, t) => s + (t.amount || 0), 0), 0],
                ['کارت', card.length, card.reduce((s, t) => s + (t.amount || 0), 0), card.reduce((s, t) => s + (t.tokens || 0), 0)],
                ['پرداخت', payment.length, payment.reduce((s, t) => s + (t.amount || 0), 0), 0],
                ['کشاوت', cashout.length, cashout.reduce((s, t) => s + (t.amount || 0), 0), 0],
                [''],
                ['کل', filtered.length, filtered.reduce((s, t) => s + (t.amount || 0), 0), filtered.reduce((s, t) => s + (t.tokens || 0), 0)]
            ];

            const summarySheet = XLSX.utils.aoa_to_sheet(summary);
            summarySheet['!cols'] = [{ wch: 15 }, { wch: 10 }, { wch: 15 }, { wch: 12 }];
            XLSX.utils.book_append_sheet(wb, summarySheet, 'خلاصه');

            // تتر
            if (usdt.length > 0) {
                const data = [['لیست USDT'], [''], ['ردیف', 'نام بازیکن', 'مبلغ', 'ژتون', 'تاریخ', 'ساعت', 'ادمین']];
                usdt.forEach((t, i) => data.push([i+1, t.player, t.amount, t.tokens||0, t.date, t.time||'', t.adminName]));
                const sheet = XLSX.utils.aoa_to_sheet(data);
                XLSX.utils.book_append_sheet(wb, sheet, 'تتر');
            }

            // ترون
            if (trx.length > 0) {
                const data = [['لیست TRX'], [''], ['ردیف', 'نام بازیکن', 'مبلغ', 'ژتون', 'تاریخ', 'ساعت', 'ادمین']];
                trx.forEach((t, i) => data.push([i+1, t.player, t.amount, t.tokens||0, t.date, t.time||'', t.adminName]));
                const sheet = XLSX.utils.aoa_to_sheet(data);
                XLSX.utils.book_append_sheet(wb, sheet, 'ترون');
            }

            // ریالی
            if (rial.length > 0) {
                const data = [['لیست ریالی'], [''], ['ردیف', 'نام بازیکن', 'مبلغ', 'سفارش', 'تاریخ', 'ساعت', 'ادمین']];
                rial.forEach((t, i) => data.push([i+1, t.player, t.amount, t.wallet||'', t.date, t.time||'', t.adminName]));
                const sheet = XLSX.utils.aoa_to_sheet(data);
                XLSX.utils.book_append_sheet(wb, sheet, 'ریالی');
            }

            // بدهی
            if (debt.length > 0) {
                const data = [['لیست بدهی'], [''], ['ردیف', 'نام بازیکن', 'مبلغ', 'تاریخ', 'ساعت', 'ادمین']];
                debt.forEach((t, i) => data.push([i+1, t.player, t.amount, t.date, t.time||'', t.adminName]));
                const sheet = XLSX.utils.aoa_to_sheet(data);
                XLSX.utils.book_append_sheet(wb, sheet, 'بدهی');
            }

            // کارت
            if (card.length > 0) {
                const data = [['لیست کارت'], [''], ['ردیف', 'نام بازیکن', 'مبلغ', 'ژتون', 'تاریخ', 'ساعت', 'ادمین']];
                card.forEach((t, i) => data.push([i+1, t.player, t.amount, t.tokens||0, t.date, t.time||'', t.adminName]));
                const sheet = XLSX.utils.aoa_to_sheet(data);
                XLSX.utils.book_append_sheet(wb, sheet, 'کارت');
            }

            // پرداخت
            if (payment.length > 0) {
                const data = [['لیست پرداخت'], [''], ['ردیف', 'نام بازیکن', 'مبلغ', 'تاریخ', 'ساعت', 'ادمین']];
                payment.forEach((t, i) => data.push([i+1, t.player, t.amount, t.date, t.time||'', t.adminName]));
                const sheet = XLSX.utils.aoa_to_sheet(data);
                XLSX.utils.book_append_sheet(wb, sheet, 'پرداخت');
            }

            // کشاوت
            if (cashout.length > 0) {
                const data = [['لیست کشاوت'], [''], ['ردیف', 'نام بازیکن', 'مبلغ', 'نوع', 'کارت/والت', 'تاریخ', 'ساعت', 'ادمین']];
                cashout.forEach((t, i) => data.push([i+1, t.player, t.amount, t.type==='cashout-rial'?'ریالی':'والت', t.wallet||'', t.date, t.time||'', t.adminName]));
                const sheet = XLSX.utils.aoa_to_sheet(data);
                XLSX.utils.book_append_sheet(wb, sheet, 'کشاوت');
            }

            XLSX.writeFile(wb, fileName);
            showMessage('✅ ' + title + ' با موفقیت دانلود شد!', 'success');
        }

        function downloadDailyReport() {
            const today = getTodayDate();
            const filtered = filterTransactions(today, today);
            createExcel(filtered, 'گزارش روزانه', `گزارش_روزانه_${today}.xlsx`);
        }

        function downloadWeeklyReport() {
            const { start, end } = getWeekRange();
            const filtered = filterTransactions(start, end);
            createExcel(filtered, 'گزارش هفتگی', `گزارش_هفتگی_${start}.xlsx`);
        }

        function downloadMonthlyReport() {
            const { start, end } = getMonthRange();
            const filtered = filterTransactions(start, end);
            createExcel(filtered, 'گزارش ماهانه', `گزارش_ماهانه_${start}.xlsx`);
        }

        // شروع
        loadData();

        // داده نمونه
        if (transactions.length === 0) {
            const today = getTodayDate();
            transactions = [
                { id: 1, type: 'usdt-bep20', date: today, time: '14:30', player: 'آرش', amount: 500, tokens: 5, wallet: 'TAddr1', adminName: 'شهاب' },
                { id: 2, type: 'trx', date: today, time: '15:45', player: 'تیام', amount: 300, tokens: 3, wallet: 'TAddr2', adminName: 'تیام' },
                { id: 3, type: 'rial', date: today, time: '16:20', player: 'تبسم', amount: 1000, tokens: 0, wallet: 'order123', adminName: 'تبسم' },
            ];
            saveData();
        }
    </script>
</body>
</html>
