<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Poker - سیستم کامل</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #FFD700;
            --dark-bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --border: #2d3548;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--dark-bg); 
            color: var(--text-primary); 
        }

        .login-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box { background: var(--card-bg); padding: 40px; border-radius: 15px; border: 1px solid var(--border); width: 100%; max-width: 400px; }
        h1 { text-align: center; color: var(--primary); margin-bottom: 10px; }
        .subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 30px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input, select { width: 100%; padding: 12px; background: var(--dark-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-family: inherit; margin-bottom: 15px; }
        input:focus, select:focus { outline: none; border-color: var(--primary); }

        .admin-btn { padding: 12px; background: var(--card-bg); border: 2px solid var(--border); border-radius: 8px; color: var(--text-primary); cursor: pointer; font-weight: 600; margin-bottom: 10px; width: 100%; }
        .admin-btn.active { background: var(--primary); color: #000; }

        .btn-login { width: 100%; padding: 14px; background: var(--primary); color: #000; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .btn-login:hover { opacity: 0.9; }

        .dashboard { display: none; min-height: 100vh; }
        .dashboard.active { display: block; }

        .navbar { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h2 { color: var(--primary); }
        .btn-logout { padding: 8px 15px; background: #ff6b6b; color: white; border: none; border-radius: 8px; cursor: pointer; }

        .content { max-width: 1200px; margin: 20px auto; padding: 20px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        .tab-btn { padding: 12px 20px; background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-weight: 600; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }

        /* PLAYERS LIST */
        .players-list { display: flex; flex-direction: column; gap: 10px; }
        .player-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .player-item:hover { border-color: var(--primary); background: rgba(255, 215, 0, 0.05); }
        
        .player-info { flex: 1; }
        .player-name { font-weight: 600; font-size: 16px; color: var(--primary); margin-bottom: 5px; }
        .player-stats { font-size: 12px; color: var(--text-secondary); }
        
        .verification-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
        }
        .verification-badge.unverified {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }

        .btn-small { padding: 8px 12px; background: var(--primary); color: #000; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-left: 10px; font-size: 12px; }
        .btn-add { padding: 10px 20px; background: var(--primary); color: #000; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

        .trans-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .trans-table th, .trans-table td { padding: 12px; text-align: right; border-bottom: 1px solid var(--border); font-size: 13px; }
        .trans-table th { background: var(--card-bg); color: var(--primary); font-weight: 600; }

        .button-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; }
        .btn-report { padding: 20px 10px; background: linear-gradient(135deg, var(--primary), #ffd700); color: #000; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 13px; }
        .btn-report:hover { transform: translateY(-3px); }

        .message { padding: 15px; margin-top: 15px; border-radius: 8px; display: none; }
        .message.success { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
        .message.error { background: rgba(244, 67, 54, 0.2); color: #f44336; }
        .message.show { display: block; }

        /* MODAL */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; }
        .modal.show { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: var(--card-bg); border-radius: 15px; padding: 30px; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .modal-header h2 { color: var(--primary); }
        .btn-close { background: none; border: none; color: var(--text-secondary); font-size: 24px; cursor: pointer; }

        .empty-state { text-align: center; color: var(--text-secondary); padding: 40px 20px; }

        .verification-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: var(--dark-bg);
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
        }

        .toggle-switch {
            width: 40px;
            height: 24px;
            background: #555;
            border-radius: 12px;
            position: relative;
            transition: all 0.3s;
        }

        .toggle-switch.active {
            background: var(--primary);
        }

        .toggle-switch::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 10px;
            top: 2px;
            left: 2px;
            transition: all 0.3s;
        }

        .toggle-switch.active::before {
            left: 18px;
        }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="loginPage" class="login-container">
        <div class="login-box">
            <h1>🎰 Silent Poker</h1>
            <p class="subtitle">سیستم حساب‌داری و گزارش</p>
            <form onsubmit="handleLogin(event)">
                <label>انتخاب ادمین:</label>
                <button type="button" class="admin-btn" onclick="selectAdmin('shahab')">Shahab (1234)</button>
                <button type="button" class="admin-btn" onclick="selectAdmin('tiyam')">Tiyam (4552)</button>
                <button type="button" class="admin-btn" onclick="selectAdmin('tabassam')">Tabassam (9825)</button>
                <button type="button" class="admin-btn" onclick="selectAdmin('arash')">Arash (4321)</button>
                <label>رمز عبور:</label>
                <input type="password" id="password" required>
                <button type="submit" class="btn-login">ورود</button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="dashboard">
        <div class="navbar">
            <h2>🎰 Silent Poker</h2>
            <div>
                <span id="adminName" style="color: var(--primary); font-weight: 600; margin-right: 20px;"></span>
                <button class="btn-logout" onclick="logout()">خروج</button>
            </div>
        </div>

        <div class="content">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('players')">👥 بازیکنان</button>
                <button class="tab-btn" onclick="switchTab('transaction')">💳 تراکنش</button>
                <button class="tab-btn" onclick="switchTab('today')">📅 امروز</button>
                <button class="tab-btn" onclick="switchTab('reports')">📊 گزارش‌ها</button>
            </div>

            <!-- PLAYERS TAB -->
            <div id="players" class="tab-content active">
                <div class="card">
                    <h3>➕ افزودن بازیکن جدید</h3>
                    <input type="text" id="newPlayerName" placeholder="نام بازیکن" style="width: 100%; margin-bottom: 10px;">
                    <button class="btn-add" onclick="addPlayer()">افزودن</button>
                </div>

                <div id="message" class="message"></div>

                <div class="players-list" id="playersList"></div>
            </div>

            <!-- TRANSACTION TAB -->
            <div id="transaction" class="tab-content">
                <div class="card">
                    <h3>💳 ثبت تراکنش جدید</h3>
                    <div class="form-row">
                        <div>
                            <label>بازیکن:</label>
                            <select id="transPlayer" required></select>
                        </div>
                        <div>
                            <label>نوع تراکنش:</label>
                            <select id="transType" onchange="updateTransactionForm()">
                                <option value="usdt">تتر (USDT)</option>
                                <option value="trx">ترون (TRX)</option>
                                <option value="rial">ریالی</option>
                                <option value="debt">بدهی</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <input type="number" id="transAmount" placeholder="مبلغ" step="0.01" required>
                        <input type="number" id="transTokens" placeholder="ژتون" value="0">
                    </div>
                    <div class="form-row">
                        <input type="date" id="transDate" required>
                        <input type="time" id="transTime" required>
                    </div>
                    <button class="btn-add" onclick="addTransaction()">✅ ثبت</button>
                </div>
            </div>

            <!-- TODAY TAB -->
            <div id="today" class="tab-content">
                <h3 style="margin-bottom: 20px;" id="todayTitle"></h3>
                <table class="trans-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>بازیکن</th>
                            <th>نوع</th>
                            <th>مبلغ</th>
                            <th>ژتون</th>
                            <th>ساعت</th>
                            <th>ادمین</th>
                            <th>عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="todayTransactions"></tbody>
                </table>
            </div>

            <!-- REPORTS TAB -->
            <div id="reports" class="tab-content">
                <div class="card">
                    <h3>📊 دانلود گزارش‌ها</h3>
                    <p style="color: var(--text-secondary); margin: 10px 0;">تمام تراکنش‌های هر دوره را به عنوان فایل Excel دانلود کنید</p>
                    <div class="button-group">
                        <button class="btn-report" onclick="downloadDailyReport()">📅<br>روزانه</button>
                        <button class="btn-report" onclick="downloadWeeklyReport()">📊<br>هفتگی</button>
                        <button class="btn-report" onclick="downloadMonthlyReport()">📈<br>ماهانه</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PLAYER HISTORY MODAL -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="historyPlayerName"></h2>
                <button class="btn-close" onclick="closeModal()">✕</button>
            </div>

            <div style="margin-bottom: 20px;">
                <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                    <div>
                        <label style="color: var(--text-secondary); font-size: 12px;">احراز درگاه:</label>
                        <div class="verification-toggle" onclick="toggleVerification()">
                            <div class="toggle-switch" id="verificationToggle"></div>
                            <span id="verificationText">تایید نشده</span>
                        </div>
                    </div>
                </div>
            </div>

            <h3 style="margin-bottom: 15px; color: var(--primary);">📋 سابقه کامل</h3>
            <table class="trans-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>نوع</th>
                        <th>مبلغ</th>
                        <th>ژتون</th>
                        <th>تاریخ</th>
                        <th>ساعت</th>
                        <th>ادمین</th>
                    </tr>
                </thead>
                <tbody id="historyTransactions"></tbody>
            </table>
        </div>
    </div>

    <script>
        const admins = {
            shahab: { password: '1234', name: 'شهاب' },
            tiyam: { password: '4552', name: 'تیام' },
            tabassam: { password: '9825', name: 'تبسم' },
            arash: { password: '4321', name: 'آرش' }
        };

        let currentAdmin = null;
        let selectedAdmin = null;
        let players = [];
        let transactions = [];
        let currentHistoryPlayer = null;

        function loadData() {
            const sp = localStorage.getItem('pokerPlayers');
            const st = localStorage.getItem('pokerTransactions');
            if (sp) players = JSON.parse(sp);
            if (st) transactions = JSON.parse(st);
        }

        function saveData() {
            localStorage.setItem('pokerPlayers', JSON.stringify(players));
            localStorage.setItem('pokerTransactions', JSON.stringify(transactions));
        }

        function selectAdmin(adminId) {
            selectedAdmin = adminId;
            document.querySelectorAll('.admin-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function handleLogin(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            if (!selectedAdmin || admins[selectedAdmin].password !== password) {
                alert('خطا!');
                return;
            }
            currentAdmin = selectedAdmin;
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            document.getElementById('adminName').textContent = '👋 ' + admins[selectedAdmin].name;
            updatePlayerSelect();
            displayPlayers();
            displayToday();
        }

        function logout() {
            currentAdmin = null;
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('password').value = '';
        }

        function addPlayer() {
            const name = document.getElementById('newPlayerName').value.trim();
            if (!name) {
                showMessage('نام بازیکن را وارد کنید!', 'error');
                return;
            }
            if (players.some(p => p.name === name)) {
                showMessage('این بازیکن قبلاً اضافه شده است!', 'error');
                return;
            }
            players.push({ id: Date.now(), name: name, verified: false });
            saveData();
            document.getElementById('newPlayerName').value = '';
            displayPlayers();
            updatePlayerSelect();
            showMessage('✅ بازیکن اضافه شد!', 'success');
        }

        function deletePlayer(id) {
            if (confirm('حذف کنید؟')) {
                players = players.filter(p => p.id !== id);
                transactions = transactions.filter(t => t.playerId !== id);
                saveData();
                displayPlayers();
                updatePlayerSelect();
                showMessage('✅ حذف شد!', 'success');
            }
        }

        function displayPlayers() {
            const list = document.getElementById('playersList');
            const sorted = [...players].sort((a, b) => a.name.localeCompare(b.name, 'fa'));
            
            if (sorted.length === 0) {
                list.innerHTML = '<div class="empty-state">بازیکنی موجود نیست</div>';
                return;
            }

            list.innerHTML = sorted.map(p => {
                const count = transactions.filter(t => t.playerId == p.id).length;
                const total = transactions.filter(t => t.playerId == p.id).reduce((s, t) => s + t.amount, 0);
                return `
                    <div class="player-item" onclick="showPlayerHistory(${p.id}, '${p.name}', ${p.verified})">
                        <div class="player-info">
                            <div class="player-name">${p.name}</div>
                            <div class="player-stats">تراکنش‌ها: ${count} | کل: ${total.toLocaleString()}</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span class="verification-badge ${p.verified ? '' : 'unverified'}">
                                ${p.verified ? '✅ احراز شده' : '❌ احراز نشده'}
                            </span>
                            <button class="btn-small" onclick="event.stopPropagation(); deletePlayer(${p.id})">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updatePlayerSelect() {
            const select = document.getElementById('transPlayer');
            if (players.length === 0) {
                select.innerHTML = '<option>بازیکن اضافه کنید</option>';
                select.disabled = true;
                return;
            }
            select.disabled = false;
            select.innerHTML = players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
        }

        function updateTransactionForm() {
            const type = document.getElementById('transType').value;
            document.getElementById('transTokens').style.display = (type === 'usdt' || type === 'trx') ? 'block' : 'none';
        }

        function addTransaction() {
            const playerId = document.getElementById('transPlayer').value;
            const type = document.getElementById('transType').value;
            const amount = parseFloat(document.getElementById('transAmount').value);
            const tokens = parseInt(document.getElementById('transTokens').value) || 0;
            const date = document.getElementById('transDate').value;
            const time = document.getElementById('transTime').value;

            if (!playerId || !amount || !date || !time) {
                showMessage('تمام فیلدها را پر کنید!', 'error');
                return;
            }

            const player = players.find(p => p.id == playerId);
            const farsiDate = new Date(date + 'T00:00:00').toLocaleDateString('fa-IR');

            transactions.push({
                id: Date.now(),
                playerId: parseInt(playerId),
                playerName: player.name,
                type: type,
                amount: amount,
                tokens: tokens,
                date: farsiDate,
                time: time,
                adminName: admins[currentAdmin].name
            });

            saveData();
            showMessage('✅ تراکنش ثبت شد!', 'success');
            document.getElementById('transAmount').value = '';
            document.getElementById('transTokens').value = '0';
            displayToday();
            displayPlayers();
        }

        function deleteTransaction(id) {
            if (confirm('حذف کنید؟')) {
                transactions = transactions.filter(t => t.id !== id);
                saveData();
                displayToday();
                displayPlayers();
                showMessage('✅ حذف شد!', 'success');
            }
        }

        function getTodayDate() {
            return new Date().toLocaleDateString('fa-IR');
        }

        function displayToday() {
            const today = getTodayDate();
            document.getElementById('todayTitle').textContent = '📅 تراکنش‌های ' + today;
            
            const todayTrans = transactions.filter(t => t.date === today).sort((a, b) => b.id - a.id);
            const tbody = document.getElementById('todayTransactions');
            
            if (todayTrans.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty-state">تراکنشی برای امروز نیست</td></tr>';
                return;
            }

            tbody.innerHTML = todayTrans.map((t, i) => `
                <tr>
                    <td>${i+1}</td>
                    <td>${t.playerName}</td>
                    <td>${t.type}</td>
                    <td>${t.amount.toLocaleString()}</td>
                    <td>${t.tokens}</td>
                    <td>${t.time}</td>
                    <td>${t.adminName}</td>
                    <td><button class="btn-small" onclick="deleteTransaction(${t.id})">🗑️</button></td>
                </tr>
            `).join('');
        }

        function showPlayerHistory(playerId, playerName, verified) {
            currentHistoryPlayer = playerId;
            document.getElementById('historyPlayerName').textContent = playerName;
            
            const toggle = document.getElementById('verificationToggle');
            const text = document.getElementById('verificationText');
            if (verified) {
                toggle.classList.add('active');
                text.textContent = 'احراز شده';
            } else {
                toggle.classList.remove('active');
                text.textContent = 'احراز نشده';
            }

            const history = transactions.filter(t => t.playerId == playerId).sort((a, b) => b.id - a.id);
            const tbody = document.getElementById('historyTransactions');
            
            if (history.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">تراکنشی برای این بازیکن نیست</td></tr>';
            } else {
                tbody.innerHTML = history.map((t, i) => `
                    <tr>
                        <td>${i+1}</td>
                        <td>${t.type}</td>
                        <td>${t.amount.toLocaleString()}</td>
                        <td>${t.tokens}</td>
                        <td>${t.date}</td>
                        <td>${t.time}</td>
                        <td>${t.adminName}</td>
                    </tr>
                `).join('');
            }

            document.getElementById('historyModal').classList.add('show');
        }

        function toggleVerification() {
            const player = players.find(p => p.id == currentHistoryPlayer);
            if (player) {
                player.verified = !player.verified;
                saveData();
                
                const toggle = document.getElementById('verificationToggle');
                const text = document.getElementById('verificationText');
                if (player.verified) {
                    toggle.classList.add('active');
                    text.textContent = 'احراز شده';
                } else {
                    toggle.classList.remove('active');
                    text.textContent = 'احراز نشده';
                }
                displayPlayers();
            }
        }

        function closeModal() {
            document.getElementById('historyModal').classList.remove('show');
            currentHistoryPlayer = null;
        }

        function getWeekRange() {
            const today = new Date();
            const day = today.getDay();
            const start = new Date(today);
            start.setDate(today.getDate() - day);
            return {
                start: start.toLocaleDateString('fa-IR'),
                end: today.toLocaleDateString('fa-IR')
            };
        }

        function getMonthRange() {
            const today = new Date();
            const start = new Date(today.getFullYear(), today.getMonth(), 1);
            const end = new Date(today.getFullYear(), today.getMonth() + 1, 0);
            return {
                start: start.toLocaleDateString('fa-IR'),
                end: end.toLocaleDateString('fa-IR')
            };
        }

        function filterTransactions(startDate, endDate) {
            return transactions.filter(t => t.date >= startDate && t.date <= endDate).sort((a, b) => b.id - a.id);
        }

        function createExcel(filtered, title, fileName) {
            if (filtered.length === 0) {
                showMessage('تراکنشی یافت نشد!', 'error');
                return;
            }

            const data = [
                [admins[currentAdmin].name + ' - ' + title],
                [''],
                ['ردیف', 'بازیکن', 'نوع', 'مبلغ', 'ژتون', 'تاریخ', 'ساعت', 'ادمین']
            ];

            filtered.forEach((t, i) => {
                data.push([i+1, t.playerName, t.type, t.amount, t.tokens, t.date, t.time, t.adminName]);
            });

            data.push(['']);
            data.push(['کل تراکنش‌ها:', filtered.length]);
            data.push(['کل مبلغ:', filtered.reduce((s, t) => s + t.amount, 0)]);

            const ws = XLSX.utils.aoa_to_sheet(data);
            ws['!cols'] = [{ wch: 6 }, { wch: 14 }, { wch: 10 }, { wch: 10 }, { wch: 8 }, { wch: 10 }, { wch: 8 }, { wch: 10 }];
            
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'گزارش');
            XLSX.writeFile(wb, fileName);
            showMessage('✅ دانلود شد!', 'success');
        }

        function downloadDailyReport() {
            const today = getTodayDate();
            const filtered = filterTransactions(today, today);
            createExcel(filtered, 'گزارش روزانه', `report_${today.replace(/\//g, '-')}.xlsx`);
        }

        function downloadWeeklyReport() {
            const { start, end } = getWeekRange();
            const filtered = filterTransactions(start, end);
            createExcel(filtered, 'گزارش هفتگی', `report_week_${start.replace(/\//g, '-')}.xlsx`);
        }

        function downloadMonthlyReport() {
            const { start, end } = getMonthRange();
            const filtered = filterTransactions(start, end);
            createExcel(filtered, 'گزارش ماهانه', `report_month_${start.replace(/\//g, '-')}.xlsx`);
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function showMessage(msg, type) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.className = 'message ' + type + ' show';
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        loadData();
        document.getElementById('transDate').valueAsDate = new Date();
        updatePlayerSelect();
        updateTransactionForm();
    </script>
</body>
</html>
