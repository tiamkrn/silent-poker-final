<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Poker Accountant</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- صفحه ورود -->
    <div class="login-container" id="loginPage">
        <!-- لوگو -->
        <div class="login-logo">
            <h1>🤫 Silent Poker</h1>
            <p>Accountant System</p>
        </div>

        <div class="login-form-wrapper">
            <div class="login-card">
                <h2>خوش‌آمدید</h2>
                
                <form onsubmit="handleLogin(event)">
                    <!-- انتخاب ادمین -->
                    <div class="form-group">
                        <label>انتخاب ادمین</label>
                        <div class="admin-buttons">
                            <button type="button" class="admin-btn admin1-btn active" onclick="selectAdmin('admin1')">ادمین 1</button>
                            <button type="button" class="admin-btn admin2-btn" onclick="selectAdmin('admin2')">ادمین 2</button>
                            <button type="button" class="admin-btn admin3-btn" onclick="selectAdmin('admin3')">ادمین 3</button>
                            <button type="button" class="admin-btn admin4-btn" onclick="selectAdmin('admin4')">ادمین 4</button>
                        </div>
                        <input type="hidden" id="adminName" value="admin1">
                    </div>

                    <!-- رمز عبور -->
                    <div class="form-group">
                        <label>رمز عبور</label>
                        <input type="password" id="password" placeholder="رمز خود را وارد کنید" required>
                        <small>رمز: pass1234</small>
                    </div>

                    <!-- دکمه ورود -->
                    <button type="submit" class="login-btn">ورود به سیستم</button>
                </form>
            </div>

            <!-- رنگ‌های مختلف -->
            <div class="color-preview">
                <h3>انتخاب رنگ</h3>
                <div class="color-options">
                    <div class="color-item" onclick="applyTheme('admin1', '#00D4FF', '#00A0CC')" style="--theme-color: #00D4FF;">
                        <span>ادمین 1</span>
                    </div>
                    <div class="color-item" onclick="applyTheme('admin2', '#FF6B6B', '#FF5252')" style="--theme-color: #FF6B6B;">
                        <span>ادمین 2</span>
                    </div>
                    <div class="color-item" onclick="applyTheme('admin3', '#4ECDC4', '#2DD4BF')" style="--theme-color: #4ECDC4;">
                        <span>ادمین 3</span>
                    </div>
                    <div class="color-item" onclick="applyTheme('admin4', '#FFD700', '#FFC700')" style="--theme-color: #FFD700;">
                        <span>ادمین 4</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- صفحه داشبورد -->
    <div class="dashboard" id="dashboard" style="display: none;">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="logo-small">🤫 Silent Poker</div>
            </div>
            <div class="header-right">
                <span class="admin-name" id="adminDisplayName"></span>
                <button class="logout-btn" onclick="logout()">خروج</button>
            </div>
        </header>

        <!-- Content -->
        <div class="dashboard-content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <nav class="nav-menu">
                    <button class="nav-item active" onclick="switchTab('players')">
                        <span class="icon">👥</span>
                        <span>بازیکنان</span>
                    </button>
                    <button class="nav-item" onclick="switchTab('charge')">
                        <span class="icon">💳</span>
                        <span>شارژ و پرداخت</span>
                    </button>
                    <button class="nav-item" onclick="switchTab('reports')">
                        <span class="icon">📊</span>
                        <span>گزارشات</span>
                    </button>
                    <button class="nav-item" onclick="switchTab('settings')">
                        <span class="icon">⚙️</span>
                        <span>تنظیمات</span>
                    </button>
                </nav>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <!-- تب بازیکنان -->
                <section id="playersTab" class="tab-section active">
                    <div class="section-header">
                        <h2>مدیریت بازیکنان</h2>
                    </div>
                    <div class="add-player-section">
                        <input type="text" id="newPlayerName" placeholder="نام بازیکن جدید...">
                        <button onclick="addPlayer()" class="btn-add">افزودن</button>
                    </div>
                    <div class="players-container" id="playersList"></div>
                </section>

                <!-- تب شارژ و پرداخت -->
                <section id="chargeTab" class="tab-section">
                    <div class="section-header">
                        <h2>شارژ و پرداخت</h2>
                    </div>
                    <div class="search-section">
                        <input type="text" id="chargeSearch" placeholder="جستجو بازیکن...">
                        <button onclick="searchForCharge()" class="btn-search">جستجو</button>
                    </div>
                    <div class="players-container" id="chargeList"></div>
                </section>

                <!-- تب گزارشات -->
                <section id="reportsTab" class="tab-section">
                    <div class="section-header">
                        <h2>گزارشات</h2>
                    </div>
                    <div id="reportContent"></div>
                </section>

                <!-- تب تنظیمات -->
                <section id="settingsTab" class="tab-section">
                    <div class="section-header">
                        <h2>تنظیمات سیستم</h2>
                    </div>
                    <div class="settings-container">
                        <div class="setting-item">
                            <label>رنگ اصلی</label>
                            <input type="color" id="primaryColor" onchange="updateThemeColor()">
                        </div>
                        <div class="setting-item">
                            <label>رنگ ثانوی</label>
                            <input type="color" id="secondaryColor" onchange="updateThemeColor()">
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- مودال سوابق -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>سوابق بازیکن</h2>
                <button class="modal-close" onclick="closeModal('historyModal')">&times;</button>
            </div>
            <div id="historyContent"></div>
        </div>
    </div>

    <!-- مودال شارژ -->
    <div id="chargeModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>شارژ و پرداخت</h2>
                <button class="modal-close" onclick="closeModal('chargeModal')">&times;</button>
            </div>
            <div id="chargeContent"></div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
