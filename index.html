<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Poker - سیستم حسابداری</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #c0c0c0;
            --accent: #e8e8e8;
            --dark-bg: #1a1a1a;
            --card-bg: #252525;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border: #404040;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%); color: var(--text-primary); min-height: 100vh; }

        .login-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-box { background: var(--card-bg); padding: 50px; border-radius: 15px; border: 2px solid var(--primary); width: 100%; max-width: 450px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: var(--primary); margin-bottom: 10px; font-size: 36px; }
        .subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 30px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input, select { width: 100%; padding: 12px; background: var(--dark-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); margin-bottom: 15px; }
        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 10px rgba(192,192,192,0.3); }

        .admin-btn { padding: 12px; background: var(--card-bg); border: 2px solid var(--border); border-radius: 8px; color: var(--text-primary); cursor: pointer; font-weight: 600; margin-bottom: 10px; width: 100%; }
        .admin-btn.active { background: var(--primary); color: #000; }

        .btn-login { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #000; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }

        .dashboard { display: none; min-height: 100vh; }
        .dashboard.active { display: block; }

        .navbar { background: linear-gradient(135deg, var(--card-bg) 0%, #2a2a2a 100%); border-bottom: 2px solid var(--primary); padding: 20px 30px; display: flex; justify-content: space-between; }
        .navbar h2 { color: var(--primary); }
        .btn-logout { padding: 10px 20px; background: #ff6b6b; color: white; border: none; border-radius: 8px; cursor: pointer; }

        .content { max-width: 1400px; margin: 20px auto; padding: 20px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border); flex-wrap: wrap; }
        .tab-btn { padding: 12px 20px; background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-weight: 600; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 25px; margin-bottom: 20px; }
        .card h3 { color: var(--primary); margin-bottom: 15px; }

        .search-box { margin-bottom: 20px; }
        .search-box input { width: 100%; }

        .player-item { background: var(--card-bg); border: 2px solid var(--border); border-radius: 10px; padding: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .player-item:hover { border-color: var(--primary); }
        
        .player-name { font-weight: 700; font-size: 16px; color: var(--primary); }
        .player-stats { font-size: 12px; color: var(--text-secondary); }
        
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-verified { background: rgba(76,175,80,0.2); color: #4caf50; }
        .badge-unverified { background: rgba(244,67,54,0.2); color: #f44336; }

        .btn-small { padding: 8px 12px; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #000; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin-left: 10px; font-size: 12px; }
        
        .btn-add { padding: 10px 20px; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #000; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }

        .trans-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .trans-table th, .trans-table td { padding: 12px; text-align: right; border-bottom: 1px solid var(--border); font-size: 13px; }
        .trans-table th { background: rgba(192,192,192,0.1); color: var(--primary); font-weight: 600; }

        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; }
        .modal.show { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: var(--card-bg); border-radius: 15px; padding: 30px; max-width: 1000px; width: 95%; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .modal-header h2 { color: var(--primary); }
        .btn-close { background: none; border: none; color: var(--text-secondary); font-size: 24px; cursor: pointer; }

        .tabs-modal { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; flex-wrap: wrap; }
        .tab-modal { padding: 8px 15px; background: transparent; border: none; color: var(--text-secondary); cursor: pointer; font-weight: 600; border-bottom: 2px solid transparent; }
        .tab-modal.active { color: var(--primary); border-bottom-color: var(--primary); }

        .modal-tab-content { display: none; }
        .modal-tab-content.active { display: block; }

        .message { padding: 15px; margin-top: 15px; border-radius: 8px; display: none; font-weight: 600; }
        .message.success { background: rgba(76,175,80,0.2); color: #4caf50; }
        .message.error { background: rgba(244,67,54,0.2); color: #f44336; }
        .message.show { display: block; }

        .charge-preview { background: var(--dark-bg); border-radius: 10px; padding: 15px; margin: 15px 0; }
        .charge-preview-item { display: flex; justify-content: space-between; margin: 8px 0; font-size: 14px; }
        .charge-preview-total { font-size: 18px; font-weight: 700; color: var(--primary); border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }

        .image-preview { max-width: 150px; max-height: 150px; border-radius: 8px; margin: 10px 0; border: 1px solid var(--border); }

        .file-input { position: relative; display: inline-block; }
        .file-input input[type="file"] { display: none; }

        .price-loader { font-size: 12px; color: var(--text-secondary); margin-top: 5px; }
        .price-loader.loading::after { content: ' ...'; animation: dots 1.5s steps(3, end) infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60%, 100% { content: '...'; } }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="loginPage" class="login-container">
        <div class="login-box">
            <h1>🎰 Silent Poker</h1>
            <p class="subtitle">سیستم حسابداری و گزارش</p>
            <form onsubmit="handleLogin(event)">
                <label>انتخاب ادمین:</label>
                <button type="button" class="admin-btn" onclick="selectAdmin('shahab')">Shahab</button>
                <button type="button" class="admin-btn" onclick="selectAdmin('tiyam')">Tiyam</button>
                <button type="button" class="admin-btn" onclick="selectAdmin('tabassam')">Tabassam</button>
                <button type="button" class="admin-btn" onclick="selectAdmin('arash')">Arash</button>
                <label>رمز عبور:</label>
                <input type="password" id="password" required autofocus>
                <button type="submit" class="btn-login">ورود</button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="dashboard">
        <div class="navbar">
            <h2>🎰 Silent Poker</h2>
            <div style="display: flex; align-items: center; gap: 20px;">
                <span id="adminName" style="color: var(--primary); font-weight: 600;"></span>
                <button class="btn-logout" onclick="logout()">خروج</button>
            </div>
        </div>

        <div class="content">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('players')">👥 بازیکنان</button>
                <button class="tab-btn" onclick="switchTab('today')">📅 امروز</button>
                <button class="tab-btn" onclick="switchTab('reports')">📊 گزارش‌ها</button>
            </div>

            <!-- PLAYERS TAB -->
            <div id="players" class="tab-content active">
                <div class="card">
                    <h3>➕ افزودن بازیکن جدید</h3>
                    <div class="form-row">
                        <input type="text" id="newPlayerName" placeholder="نام بازیکن (انگلیسی)">
                        <div class="file-input">
                            <button type="button" class="btn-add" onclick="document.getElementById('excelInput').click()" style="width: 100%;">📤 Import اکسل</button>
                            <input type="file" id="excelInput" accept=".xlsx,.xls" onchange="importExcel(event)">
                        </div>
                    </div>
                    <button class="btn-add" onclick="addPlayer()" style="width: 100%;">افزودن</button>
                </div>

                <div id="message" class="message"></div>

                <div class="search-box">
                    <input type="text" id="playerSearch" placeholder="🔍 جستجوی بازیکن..." onkeyup="filterPlayers()">
                </div>

                <div id="playersList"></div>
            </div>

            <!-- TODAY TAB -->
            <div id="today" class="tab-content">
                <h3 id="todayTitle" style="margin-bottom: 20px;"></h3>
                <table class="trans-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>بازیکن</th>
                            <th>نوع</th>
                            <th>مبلغ</th>
                            <th>بونوس</th>
                            <th>جمع</th>
                            <th>تاریخ</th>
                            <th>ساعت</th>
                            <th>ادمین</th>
                        </tr>
                    </thead>
                    <tbody id="todayTransactions"></tbody>
                </table>
            </div>

            <!-- REPORTS TAB -->
            <div id="reports" class="tab-content">
                <div class="card">
                    <h3>📊 دانلود گزارش‌ها</h3>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-top: 20px;">
                        <button class="btn-add" onclick="downloadDailyReport()">📅 روزانه</button>
                        <button class="btn-add" onclick="downloadWeeklyReport()">📊 هفتگی</button>
                        <button class="btn-add" onclick="downloadMonthlyReport()">📈 ماهانه</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PLAYER MODAL -->
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalPlayerName"></h2>
                <button class="btn-close" onclick="closeModal()">✕</button>
            </div>

            <div class="tabs-modal">
                <button class="tab-modal active" onclick="switchModalTab('info')">📋 اطلاعات</button>
                <button class="tab-modal" onclick="switchModalTab('history')">📊 سابقه</button>
                <button class="tab-modal" onclick="switchModalTab('charge')">💳 شارژ</button>
            </div>

            <!-- INFO TAB -->
            <div id="modalInfo" class="modal-tab-content active">
                <label style="color: var(--text-secondary); font-size: 12px;">احراز درگاه:</label>
                <div style="display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--dark-bg); border-radius: 6px; cursor: pointer; margin-bottom: 20px;" onclick="toggleVerification()">
                    <div class="toggle-switch" id="verificationToggle" style="width: 40px; height: 24px; background: var(--border); border-radius: 12px; position: relative; transition: all 0.3s;"></div>
                    <span id="verificationText">تایید نشده</span>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px;">
                    <div style="background: var(--dark-bg); padding: 15px; border-radius: 8px;">
                        <div style="font-size: 12px; color: var(--text-secondary);">کل شارژ</div>
                        <div style="font-size: 20px; color: var(--primary); font-weight: 700;" id="totalChargeModal">0</div>
                    </div>
                </div>
            </div>

            <!-- HISTORY TAB -->
            <div id="modalHistory" class="modal-tab-content">
                <h3 style="margin-bottom: 15px; color: var(--primary);">📋 سابقه شارژ‌ها</h3>
                <table class="trans-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>نوع</th>
                            <th>مبلغ</th>
                            <th>بونوس</th>
                            <th>جمع</th>
                            <th>تاریخ</th>
                            <th>ساعت</th>
                            <th>ادمین</th>
                        </tr>
                    </thead>
                    <tbody id="historyTransactions"></tbody>
                </table>
            </div>

            <!-- CHARGE TAB -->
            <div id="modalCharge" class="modal-tab-content">
                <h3 style="margin-bottom: 15px; color: var(--primary);">💳 شارژ جدید</h3>
                
                <div style="margin-bottom: 20px;">
                    <label>نوع شارژ:</label>
                    <select id="chargeType" onchange="updateChargeForm()">
                        <option value="usdt-bep20">تتر (USDT BEP20)</option>
                        <option value="usdt-trc20">تتر (USDT TRC20)</option>
                        <option value="trx">ترون (TRX)</option>
                        <option value="rial">ریالی</option>
                    </select>
                </div>

                <!-- USDT/TRX FORM -->
                <div id="cryptoForm" style="display: none;">
                    <div class="form-row">
                        <div>
                            <label id="amountLabel">مبلغ (دلار):</label>
                            <input type="number" id="chargeAmount" placeholder="0" step="0.01" onchange="calculateCharge()">
                        </div>
                        <div>
                            <label id="priceLabel">قیمت دلار (تومان):</label>
                            <input type="number" id="chargePrice" placeholder="0" onchange="calculateCharge()">
                            <div class="price-loader" id="priceLoader"></div>
                            <button type="button" class="btn-small" onclick="fetchExchangeRate()" style="margin-top: 10px; margin-left: 0;">🔄 بروزرسانی</button>
                        </div>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label>هش (Transaction ID):</label>
                        <input type="text" id="chargeHash" placeholder="0x...">
                    </div>
                </div>

                <!-- RIAL FORM -->
                <div id="rialForm" style="display: none;">
                    <div class="form-row">
                        <div>
                            <label>مبلغ (تومان):</label>
                            <input type="number" id="chargeRialAmount" placeholder="0" step="1" onchange="calculateRialCharge()">
                        </div>
                        <div>
                            <label>شماره سفارش:</label>
                            <input type="text" id="chargeOrderId" placeholder="12345678">
                        </div>
                    </div>
                </div>

                <!-- COMMON -->
                <div class="form-row">
                    <input type="date" id="chargeDate" required>
                    <input type="time" id="chargeTime" required>
                </div>

                <!-- IMAGE -->
                <div style="margin-bottom: 15px;">
                    <label>عکس / اسکرین شات:</label>
                    <div class="file-input">
                        <button type="button" class="btn-add" onclick="document.getElementById('chargeImage').click()" style="width: 100%; margin-bottom: 10px;">📤 آپلود عکس</button>
                        <input type="file" id="chargeImage" accept="image/*" onchange="previewImage()">
                    </div>
                    <img id="imagePreview" class="image-preview" style="display: none;">
                </div>

                <!-- PREVIEW -->
                <div class="charge-preview">
                    <div class="charge-preview-item">
                        <span>مبلغ:</span>
                        <strong id="previewAmount">0</strong>
                    </div>
                    <div class="charge-preview-item">
                        <span>بونوس (10%):</span>
                        <strong id="previewBonus">0</strong>
                    </div>
                    <div class="charge-preview-total">
                        <div style="display: flex; justify-content: space-between;">
                            <span>جمع کل:</span>
                            <strong id="previewTotal">0</strong>
                        </div>
                    </div>
                </div>

                <button class="btn-add" onclick="saveCharge()" style="width: 100%;">✅ ثبت شارژ</button>
            </div>
        </div>
    </div>

    <script>
        const admins = {
            shahab: { password: '1234', name: 'شهاب' },
            tiyam: { password: '4552', name: 'تیام' },
            tabassam: { password: '9825', name: 'تبسم' },
            arash: { password: '4321', name: 'آرش' }
        };

        let currentAdmin = null;
        let selectedAdmin = null;
        let players = [];
        let charges = [];
        let currentModalPlayer = null;
        let currentChargeImage = null;

        function loadData() {
            const sp = localStorage.getItem('pokerPlayers');
            const sc = localStorage.getItem('pokerCharges');
            if (sp) players = JSON.parse(sp);
            if (sc) charges = JSON.parse(sc);
        }

        function saveData() {
            localStorage.setItem('pokerPlayers', JSON.stringify(players));
            localStorage.setItem('pokerCharges', JSON.stringify(charges));
        }

        function selectAdmin(adminId) {
            selectedAdmin = adminId;
            document.querySelectorAll('.admin-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function handleLogin(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            if (!selectedAdmin || admins[selectedAdmin].password !== password) {
                alert('❌ خطا!');
                return;
            }
            currentAdmin = selectedAdmin;
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            document.getElementById('adminName').textContent = '👋 ' + admins[selectedAdmin].name;
            displayPlayers();
            displayToday();
            document.getElementById('chargeDate').valueAsDate = new Date();
            document.getElementById('chargeTime').value = new Date().toTimeString().slice(0, 5);
            fetchExchangeRate();
        }

        function logout() {
            currentAdmin = null;
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('password').value = '';
        }

        function fetchExchangeRate() {
            const loader = document.getElementById('priceLoader');
            loader.classList.add('loading');
            loader.textContent = 'در حال بروزرسانی';

            fetch('https://api.exchangerate-api.com/v4/latest/USD')
                .then(res => res.json())
                .then(data => {
                    const irr = data.rates.IRR;
                    document.getElementById('chargePrice').value = Math.round(irr);
                    calculateCharge();
                    loader.classList.remove('loading');
                    loader.textContent = `✅ آپدیت شد: ${Math.round(irr).toLocaleString()} تومان`;
                })
                .catch(err => {
                    loader.classList.remove('loading');
                    loader.textContent = '❌ خطا در دریافت قیمت';
                    console.log(err);
                });
        }

        function importExcel(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

                    let added = 0;
                    rows.forEach((row, idx) => {
                        if (idx > 3 && row[row.length - 1]) {
                            const name = row[row.length - 1].toString().trim();
                            if (name && !['اسم یوزر', 'یوزر'].includes(name)) {
                                players.push({ id: Date.now() + Math.random(), name: name, verified: false });
                                added++;
                            }
                        }
                    });

                    if (added > 0) {
                        saveData();
                        displayPlayers();
                        showMessage(`✅ ${added} بازیکن اضافه شد!`, 'success');
                    }
                } catch (error) {
                    showMessage('❌ خطا در خواندن فایل', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function addPlayer() {
            const name = document.getElementById('newPlayerName').value.trim();
            if (!name) {
                showMessage('نام بازیکن را وارد کنید!', 'error');
                return;
            }
            players.push({ id: Date.now(), name: name, verified: false });
            saveData();
            document.getElementById('newPlayerName').value = '';
            displayPlayers();
            showMessage('✅ بازیکن اضافه شد!', 'success');
        }

        function filterPlayers() {
            const search = document.getElementById('playerSearch').value.toLowerCase();
            document.querySelectorAll('.player-item').forEach(item => {
                const name = item.querySelector('.player-name').textContent.toLowerCase();
                item.style.display = name.includes(search) ? 'flex' : 'none';
            });
        }

        function displayPlayers() {
            const list = document.getElementById('playersList');
            const sorted = [...players].sort((a, b) => a.name.localeCompare(b.name, 'en'));
            
            if (sorted.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: var(--text-secondary); padding: 40px;">بازیکنی موجود نیست</div>';
                return;
            }

            list.innerHTML = sorted.map(p => {
                const playerCharges = charges.filter(c => c.playerId == p.id);
                const totalCharge = playerCharges.reduce((s, c) => s + c.total, 0);
                
                return `
                    <div class="player-item" onclick="showPlayerModal(${p.id}, '${p.name}', ${p.verified})">
                        <div style="flex: 1;">
                            <div class="player-name">${p.name}</div>
                            <div class="player-stats">شارژ کل: ${totalCharge.toLocaleString()}</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span class="badge ${p.verified ? 'badge-verified' : 'badge-unverified'}">
                                ${p.verified ? '✅' : '❌'}
                            </span>
                            <button class="btn-small" onclick="event.stopPropagation(); deletePlayer(${p.id})">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function deletePlayer(id) {
            if (confirm('حذف کنید؟')) {
                players = players.filter(p => p.id !== id);
                saveData();
                displayPlayers();
                showMessage('✅ حذف شد!', 'success');
            }
        }

        function showPlayerModal(playerId, playerName, verified) {
            currentModalPlayer = playerId;
            document.getElementById('modalPlayerName').textContent = playerName;
            
            const toggle = document.getElementById('verificationToggle');
            const text = document.getElementById('verificationText');
            if (verified) {
                toggle.style.background = 'var(--primary)';
                text.textContent = 'احراز شده';
            } else {
                toggle.style.background = 'var(--border)';
                text.textContent = 'احراز نشده';
            }

            const playerCharges = charges.filter(c => c.playerId == playerId);
            const totalCharge = playerCharges.reduce((s, c) => s + c.total, 0);
            
            document.getElementById('totalChargeModal').textContent = totalCharge.toLocaleString();
            
            const tbody = document.getElementById('historyTransactions');
            if (playerCharges.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--text-secondary);">شارژی موجود نیست</td></tr>';
            } else {
                tbody.innerHTML = playerCharges.map((c, i) => `
                    <tr>
                        <td>${i+1}</td>
                        <td>${c.type}</td>
                        <td>${c.amount.toLocaleString()}</td>
                        <td>${c.bonus.toLocaleString()}</td>
                        <td>${c.total.toLocaleString()}</td>
                        <td>${c.date}</td>
                        <td>${c.time}</td>
                        <td><span style="background: rgba(192,192,192,0.2); color: var(--primary); padding: 3px 8px; border-radius: 4px; font-size: 11px;">${c.adminName}</span></td>
                    </tr>
                `).join('');
            }

            switchModalTab('info');
            document.getElementById('playerModal').classList.add('show');
        }

        function switchModalTab(tabName) {
            document.querySelectorAll('.modal-tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-modal').forEach(b => b.classList.remove('active'));
            document.getElementById('modal' + tabName.charAt(0).toUpperCase() + tabName.slice(1)).classList.add('active');
            event.target.classList.add('active');
        }

        function toggleVerification() {
            const player = players.find(p => p.id == currentModalPlayer);
            if (player) {
                player.verified = !player.verified;
                saveData();
                
                const toggle = document.getElementById('verificationToggle');
                const text = document.getElementById('verificationText');
                if (player.verified) {
                    toggle.style.background = 'var(--primary)';
                    text.textContent = 'احراز شده';
                } else {
                    toggle.style.background = 'var(--border)';
                    text.textContent = 'احراز نشده';
                }
                displayPlayers();
            }
        }

        function updateChargeForm() {
            const type = document.getElementById('chargeType').value;
            const cryptoForm = document.getElementById('cryptoForm');
            const rialForm = document.getElementById('rialForm');
            const amountLabel = document.getElementById('amountLabel');
            const priceLabel = document.getElementById('priceLabel');

            if (type === 'rial') {
                cryptoForm.style.display = 'none';
                rialForm.style.display = 'block';
            } else {
                cryptoForm.style.display = 'block';
                rialForm.style.display = 'none';
                
                if (type.includes('usdt')) {
                    amountLabel.textContent = 'مبلغ (دلار):';
                    priceLabel.textContent = 'قیمت دلار (تومان):';
                } else if (type === 'trx') {
                    amountLabel.textContent = 'مبلغ (TRX):';
                    priceLabel.textContent = 'قیمت TRX (تومان):';
                }
            }
        }

        function calculateCharge() {
            const amount = parseFloat(document.getElementById('chargeAmount').value) || 0;
            const price = parseFloat(document.getElementById('chargePrice').value) || 0;
            const rialAmount = amount * price;
            const bonus = rialAmount * 0.1;
            const total = rialAmount + bonus;

            document.getElementById('previewAmount').textContent = rialAmount.toLocaleString();
            document.getElementById('previewBonus').textContent = bonus.toLocaleString();
            document.getElementById('previewTotal').textContent = total.toLocaleString();
        }

        function calculateRialCharge() {
            const amount = parseFloat(document.getElementById('chargeRialAmount').value) || 0;
            const bonus = 0;
            const total = amount;

            document.getElementById('previewAmount').textContent = amount.toLocaleString();
            document.getElementById('previewBonus').textContent = bonus.toLocaleString();
            document.getElementById('previewTotal').textContent = total.toLocaleString();
        }

        function previewImage() {
            const file = document.getElementById('chargeImage').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    currentChargeImage = e.target.result;
                    document.getElementById('imagePreview').src = currentChargeImage;
                    document.getElementById('imagePreview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        function saveCharge() {
            const type = document.getElementById('chargeType').value;
            const date = document.getElementById('chargeDate').value;
            const time = document.getElementById('chargeTime').value;
            const farsiDate = new Date(date + 'T00:00:00').toLocaleDateString('fa-IR');

            let amount, bonus, total, hash, orderId;

            if (type === 'rial') {
                amount = parseFloat(document.getElementById('chargeRialAmount').value);
                orderId = document.getElementById('chargeOrderId').value;
                if (!amount || !orderId) {
                    showMessage('تمام فیلدها را پر کنید!', 'error');
                    return;
                }
                bonus = 0;
                total = amount;
            } else {
                amount = parseFloat(document.getElementById('chargeAmount').value);
                const price = parseFloat(document.getElementById('chargePrice').value);
                hash = document.getElementById('chargeHash').value;
                if (!amount || !price || !hash) {
                    showMessage('تمام فیلدها را پر کنید!', 'error');
                    return;
                }
                amount = amount * price;
                bonus = amount * 0.1;
                total = amount + bonus;
            }

            charges.push({
                id: Date.now(),
                playerId: currentModalPlayer,
                type: type,
                amount: amount,
                bonus: bonus,
                total: total,
                date: farsiDate,
                time: time,
                hash: hash || null,
                orderId: orderId || null,
                image: currentChargeImage,
                adminName: admins[currentAdmin].name
            });

            saveData();
            showMessage('✅ شارژ ثبت شد!', 'success');
            
            document.getElementById('chargeAmount').value = '';
            document.getElementById('chargePrice').value = '';
            document.getElementById('chargeHash').value = '';
            document.getElementById('chargeRialAmount').value = '';
            document.getElementById('chargeOrderId').value = '';
            document.getElementById('chargeImage').value = '';
            document.getElementById('imagePreview').style.display = 'none';
            currentChargeImage = null;
            
            displayPlayers();
            displayToday();
            showPlayerModal(currentModalPlayer, players.find(p => p.id == currentModalPlayer)?.name, players.find(p => p.id == currentModalPlayer)?.verified);
        }

        function displayToday() {
            const today = new Date().toLocaleDateString('fa-IR');
            document.getElementById('todayTitle').textContent = '📅 تراکنش‌های ' + today;
            
            const todayCharges = charges.filter(c => c.date === today).sort((a, b) => b.id - a.id);
            const tbody = document.getElementById('todayTransactions');
            
            if (todayCharges.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; color: var(--text-secondary);">شارژی برای امروز نیست</td></tr>';
                return;
            }

            tbody.innerHTML = todayCharges.map((c, i) => `
                <tr>
                    <td>${i+1}</td>
                    <td>${players.find(p => p.id == c.playerId)?.name}</td>
                    <td>${c.type}</td>
                    <td>${c.amount.toLocaleString()}</td>
                    <td>${c.bonus.toLocaleString()}</td>
                    <td>${c.total.toLocaleString()}</td>
                    <td>${c.date}</td>
                    <td>${c.time}</td>
                    <td><span style="background: rgba(192,192,192,0.2); color: var(--primary); padding: 3px 8px; border-radius: 4px; font-size: 11px;">${c.adminName}</span></td>
                </tr>
            `).join('');
        }

        function downloadDailyReport() {
            const today = new Date().toLocaleDateString('fa-IR');
            const filtered = charges.filter(c => c.date === today);
            createExcel(filtered, 'گزارش روزانه', `report_${today.replace(/\//g, '-')}.xlsx`);
        }

        function downloadWeeklyReport() {
            const today = new Date();
            const day = today.getDay();
            const start = new Date(today);
            start.setDate(today.getDate() - day);
            const startDate = start.toLocaleDateString('fa-IR');
            const endDate = today.toLocaleDateString('fa-IR');
            
            const filtered = charges.filter(c => c.date >= startDate && c.date <= endDate);
            createExcel(filtered, 'گزارش هفتگی', `report_week_${startDate.replace(/\//g, '-')}.xlsx`);
        }

        function downloadMonthlyReport() {
            const today = new Date();
            const start = new Date(today.getFullYear(), today.getMonth(), 1);
            const end = new Date(today.getFullYear(), today.getMonth() + 1, 0);
            const startDate = start.toLocaleDateString('fa-IR');
            const endDate = end.toLocaleDateString('fa-IR');
            
            const filtered = charges.filter(c => c.date >= startDate && c.date <= endDate);
            createExcel(filtered, 'گزارش ماهانه', `report_month_${startDate.replace(/\//g, '-')}.xlsx`);
        }

        function createExcel(filtered, title, fileName) {
            if (filtered.length === 0) {
                showMessage('شارژی یافت نشد!', 'error');
                return;
            }

            const data = [
                [admins[currentAdmin].name + ' - ' + title],
                [''],
                ['ردیف', 'بازیکن', 'نوع', 'مبلغ', 'بونوس', 'جمع', 'تاریخ', 'ساعت', 'ادمین']
            ];

            filtered.forEach((c, i) => {
                data.push([i+1, players.find(p => p.id == c.playerId)?.name, c.type, c.amount, c.bonus, c.total, c.date, c.time, c.adminName]);
            });

            data.push(['']);
            data.push(['کل شارژ:', filtered.length]);
            data.push(['کل مبلغ:', filtered.reduce((s, c) => s + c.amount, 0)]);
            data.push(['کل بونوس:', filtered.reduce((s, c) => s + c.bonus, 0)]);
            data.push(['کل جمع:', filtered.reduce((s, c) => s + c.total, 0)]);

            const ws = XLSX.utils.aoa_to_sheet(data);
            ws['!cols'] = [{ wch: 6 }, { wch: 14 }, { wch: 14 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 8 }, { wch: 12 }];
            
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'گزارش');
            XLSX.writeFile(wb, fileName);
            showMessage('✅ دانلود شد!', 'success');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function closeModal() {
            document.getElementById('playerModal').classList.remove('show');
            currentModalPlayer = null;
        }

        function showMessage(msg, type) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.className = 'message ' + type + ' show';
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        loadData();
        document.getElementById('chargeDate').valueAsDate = new Date();
        document.getElementById('chargeTime').value = new Date().toTimeString().slice(0, 5);
        updateChargeForm();
    </script>
</body>
</html>
